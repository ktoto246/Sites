<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приложение Курьера | МСК</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/courier.css">
</head>
<body>

<div class="mobile-container">
    <!-- Шапка -->
    <div class="courier-header">
        <div>
            <h5 class="mb-0">Курьер: <span id="courierName">...</span></h5>
            <small class="text-muted" id="shiftStatus">Смена не открыта</small>
        </div>
        <button class="btn-logout" onclick="logout()">
            <i class="bi bi-box-arrow-right"></i>
        </button>
    </div>

    <!-- Переключатель смены -->
    <div class="shift-toggle-wrapper">
        <button id="shiftToggleBtn" class="shift-toggle-btn off" onclick="toggleShift()">
            <i class="bi bi-power"></i>
            <span>Начать смену</span>
        </button>
    </div>

    <!-- KPI Карточки -->
    <div class="kpi-row">
        <div class="kpi-card">
            <div class="kpi-icon bg-success bg-opacity-10 text-success">
                <i class="bi bi-check-circle"></i>
            </div>
            <div class="kpi-info">
                <div class="kpi-value" id="kpiDelivered">0</div>
                <div class="kpi-label">Доставлено</div>
            </div>
        </div>
        <div class="kpi-card">
            <div class="kpi-icon bg-warning bg-opacity-10 text-warning">
                <i class="bi bi-hourglass-split"></i>
            </div>
            <div class="kpi-info">
                <div class="kpi-value" id="kpiActive">0</div>
                <div class="kpi-label">Активных</div>
            </div>
        </div>
    </div>

    <!-- Табы -->
    <div class="nav-tabs-custom">
        <button class="active" id="tabActive" onclick="switchTab('active')">
            <i class="bi bi-truck me-1"></i> Активный заказ
        </button>
        <button id="tabHistory" onclick="switchTab('history')">
            <i class="bi bi-clock-history me-1"></i> История
        </button>
    </div>

    <!-- Контент -->
    <div class="order-content">
        <!-- Активный заказ -->
        <div id="activeOrderView">
            <div id="orderContainer">
                <!-- Рендерится через JS -->
            </div>
        </div>

        <!-- История -->
        <div id="historyOrderView" class="d-none">
            <div id="historyContainer">
                <!-- Рендерится через JS -->
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/db.js"></script>
<script src="js/courier.js"></script>
</body>
</html>
