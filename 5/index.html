<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему | Масло-сыр комбинат</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

<div class="auth-wrapper">
    <div class="glass-card">
        <div class="text-center mb-4">
            <div class="brand-icon">
                <i class="bi bi-egg-fried"></i>
            </div>
            <h3 class="mt-3">Масло-Сыр Комбинат</h3>
            <p class="text-muted small">Вход в систему</p>
        </div>

        <!-- Форма входа -->
        <div id="loginForm">
            <div class="mb-3">
                <label class="form-label">Логин</label>
                <input type="text" id="loginInput" class="form-control" placeholder="Введите логин">
            </div>

            <div class="mb-4">
                <label class="form-label">Пароль</label>
                <div class="input-group">
                    <input type="password" id="passwordInput" class="form-control" placeholder="Введите пароль">
                    <button class="btn btn-outline-secondary" type="button" onclick="togglePassword()">
                        <i class="bi bi-eye" id="toggleIcon"></i>
                    </button>
                </div>
            </div>

            <button class="btn btn-primary w-100 mb-3" onclick="login(document.getElementById('loginInput').value, document.getElementById('passwordInput').value)">
                Войти
            </button>

            <div class="text-center mb-3">
                <span class="text-muted">Нет аккаунта?</span>
                <a href="#" onclick="switchForm('register')" class="text-decoration-none fw-bold">Зарегистрироваться</a>
            </div>

            <div class="text-center">
                <a href="buyer.html" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-bag me-1"></i> Перейти к каталогу
                </a>
            </div>
        </div>

        <!-- Форма регистрации -->
        <div id="registerForm" style="display: none;">
            <div class="mb-3">
                <label class="form-label">ФИО</label>
                <input type="text" id="regFullName" class="form-control" placeholder="Иванов Иван Иванович">
            </div>

            <div class="mb-3">
                <label class="form-label">Логин</label>
                <input type="text" id="regLogin" class="form-control" placeholder="Придумайте логин">
            </div>

            <div class="mb-4">
                <label class="form-label">Пароль</label>
                <input type="password" id="regPassword" class="form-control" placeholder="Придумайте пароль">
            </div>

            <button class="btn btn-primary w-100 mb-3" onclick="register(document.getElementById('regLogin').value, document.getElementById('regPassword').value, document.getElementById('regFullName').value)">
                Создать аккаунт
            </button>

            <div class="text-center">
                <span class="text-muted">Уже есть аккаунт?</span>
                <a href="#" onclick="switchForm('login')" class="text-decoration-none fw-bold">Вернуться ко входу</a>
            </div>
        </div>

        <!-- Демо-кнопки -->
        <div class="mt-4 pt-3 border-top">
            <p class="text-center text-muted small mb-2">Быстрый доступ (для демо):</p>
            <div class="demo-badges d-flex flex-wrap justify-content-center gap-2">
                <span class="badge bg-dark" onclick="login('admin', '123')">Админ</span>
                <span class="badge bg-primary" onclick="login('disp', '123')">Диспетчер</span>
                <span class="badge bg-success" onclick="login('cour1', '123')">Курьер</span>
                <span class="badge bg-warning text-dark" onclick="login('buyer', '123')">Покупатель</span>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script>
    function switchForm(formName) {
        if (formName === 'login') {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('registerForm').style.display = 'none';
        } else {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
        }
    }

    function togglePassword() {
        const passwordInput = document.getElementById('passwordInput');
        const toggleIcon = document.getElementById('toggleIcon');
        
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            toggleIcon.classList.remove('bi-eye');
            toggleIcon.classList.add('bi-eye-slash');
        } else {
            passwordInput.type = 'password';
            toggleIcon.classList.remove('bi-eye-slash');
            toggleIcon.classList.add('bi-eye');
        }
    }

    document.getElementById('passwordInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            login(document.getElementById('loginInput').value, document.getElementById('passwordInput').value);
        }
    });
</script>

</body>
</html>
