<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог | Масло-сыр комбинат</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/buyer.css">
</head>
<body>

<!-- Навигация -->
<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" href="buyer.html">
            <i class="bi bi-egg-fried fs-4"></i>
            <span>Маско-Сыр Комбинат</span>
        </a>
        <div class="d-flex align-items-center gap-3">
            <button class="btn btn-outline-light position-relative" type="button" data-bs-toggle="offcanvas" data-bs-target="#cartOffcanvas">
                <i class="bi bi-bag fs-5"></i> Корзина <span id="cartBadge" class="badge bg-warning text-dark rounded-pill">0</span>
            </button>
            <div id="authButtons">
                <!-- Заполняется через JS -->
            </div>
        </div>
    </div>
</nav>

<!-- Hero секция -->
<section class="hero-section">
    <div class="hero-overlay"></div>
    <div class="container hero-content">
        <span class="hero-badge">🧀 Натуральная продукция напрямую с комбината</span>
        <h1 class="hero-title">Свежие сыры и масло <br><span>премиального качества</span></h1>
        <p class="hero-subtitle">Более 10 видов продукции. Производство по ГОСТ. Доставка по городу.</p>
    </div>
</section>

<!-- Основной контейнер -->
<div class="container" style="margin-top: -60px; position: relative; z-index: 10;">
    
    <!-- Панель фильтров -->
    <div class="catalog-wrapper">
        <div class="row g-3 mb-4">
            <div class="col-12">
                <div class="search-bar-wrapper">
                    <i class="bi bi-search search-icon"></i>
                    <input type="text" id="searchInput" class="form-control search-input" placeholder="Найти сыр, масло или другой продукт...">
                    <button id="clearSearch" class="btn-clear-search d-none"><i class="bi bi-x-lg"></i></button>
                </div>
            </div>
        </div>

        <!-- Быстрые фильтры -->
        <div class="quick-filters mb-3">
            <button class="filter-chip active" data-filter="all">
                <i class="bi bi-grid-3x3-gap"></i> Все товары
            </button>
            <button class="filter-chip" data-filter="cheese">
                <i class="bi bi-egg-fried"></i> Сыры
            </button>
            <button class="filter-chip" data-filter="butter">
                <i class="bi bi-cup-hot"></i> Масло
            </button>
            <button class="filter-chip" data-filter="available">
                <i class="bi bi-box-seam"></i> В наличии
            </button>
        </div>

        <!-- Расширенные фильтры -->
        <div class="advanced-filters mb-4">
            <button class="btn btn-light btn-sm" type="button" data-bs-toggle="collapse" data-bs-target="#advFilters">
                <i class="bi bi-sliders me-1"></i> Расширенные фильтры
            </button>
            <div class="collapse mt-3" id="advFilters">
                <div class="card-box p-4">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label fw-bold small text-uppercase text-muted">Жирность</label>
                            <div class="d-flex flex-wrap gap-2">
                                <button class="btn btn-outline-secondary btn-sm fat-btn active" data-fat="all">Любая</button>
                                <button class="btn btn-outline-secondary btn-sm fat-btn" data-fat="low">до 45%</button>
                                <button class="btn btn-outline-secondary btn-sm fat-btn" data-fat="mid">45-60%</button>
                                <button class="btn btn-outline-secondary btn-sm fat-btn" data-fat="high">более 60%</button>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold small text-uppercase text-muted">Цена, ₽</label>
                            <div class="d-flex gap-2 align-items-center">
                                <input type="number" id="priceMin" class="form-control form-control-sm" placeholder="От" min="0">
                                <span class="text-muted">—</span>
                                <input type="number" id="priceMax" class="form-control form-control-sm" placeholder="До" min="0">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold small text-uppercase text-muted">Сортировка</label>
                            <select id="sortBy" class="form-select form-select-sm">
                                <option value="default">По умолчанию</option>
                                <option value="price_asc">Цена: по возрастанию</option>
                                <option value="price_desc">Цена: по убыванию</option>
                                <option value="name_asc">Название: А-Я</option>
                                <option value="fat_desc">Жирность: по убыванию</option>
                            </select>
                        </div>
                    </div>
                    <div class="mt-3 text-end">
                        <button id="resetFilters" class="btn btn-link btn-sm text-muted">
                            <i class="bi bi-arrow-counterclockwise"></i> Сбросить все фильтры
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Счётчик результатов -->
        <div class="results-info mb-3">
            <span id="resultsCount">Загрузка...</span>
        </div>

        <!-- Сетка товаров -->
        <div id="catalogGrid" class="row g-4">
            <!-- Товары рендерятся через JS -->
        </div>
    </div>
</div>

<!-- Модалка выбора фасовки -->
<div class="modal fade" id="productModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-body p-0">
                <div class="row g-0">
                    <div class="col-md-5">
                        <img id="modalProductImg" src="" class="w-100 h-100" style="object-fit: cover;" alt="">
                    </div>
                    <div class="col-md-7">
                        <div class="p-4">
                            <h4 id="modalProductName" class="fw-bold mb-2"></h4>
                            <p id="modalProductDesc" class="text-muted small mb-3"></p>
                            <div class="mb-3">
                                <span class="badge bg-secondary" id="modalProductFat"></span>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold small">Выберите фасовку</label>
                                <select id="modalWeightSelect" class="form-select"></select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold small">Количество</label>
                                <input type="number" id="modalQty" class="form-control" value="1" min="1">
                            </div>
                            <button class="btn btn-primary w-100" onclick="addToCart()">
                                <i class="bi bi-bag-plus me-2"></i> Добавить в корзину
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Выезжающая корзина -->
<div class="offcanvas offcanvas-end" tabindex="-1" id="cartOffcanvas">
    <div class="offcanvas-header text-white">
        <h5 class="offcanvas-title"><i class="bi bi-bag me-2"></i>Ваш заказ</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
        <div id="cartItems" class="mb-4">
            <!-- Товары в корзине -->
        </div>
        <hr>
        <div class="d-flex justify-content-between align-items-center mb-3">
            <span class="fw-bold fs-5">Итого:</span>
            <span id="cartTotal" class="fw-bold fs-4 text-primary">0 ₽</span>
        </div>
        
        <!-- Форма оформления -->
        <div id="checkoutForm" class="d-none">
            <h6 class="fw-bold mb-3">Способ получения</h6>
            <div class="form-check mb-2">
                <input class="form-check-input" type="radio" name="deliveryType" id="delPickup" value="pickup" checked onchange="toggleAddress()">
                <label class="form-check-label" for="delPickup">
                    Самовывоз со склада <span class="badge bg-success">Бесплатно</span>
                </label>
            </div>
            <div class="form-check mb-3">
                <input class="form-check-input" type="radio" name="deliveryType" id="delCourier" value="delivery" onchange="toggleAddress()">
                <label class="form-check-label" for="delCourier">
                    Доставка курьером
                </label>
            </div>
            
            <div id="addressBlock" class="d-none mb-3">
                <label class="form-label fw-bold small">Адрес доставки</label>
                <input type="text" id="orderAddress" class="form-control" placeholder="ул. Примерная, д. 1, кв. 10">
            </div>
            
            <h6 class="fw-bold mb-3">Данные карты</h6>
            <div class="mb-2">
                <input type="text" id="orderCardNum" class="form-control" placeholder="Номер карты" maxlength="16">
            </div>
            <div class="row g-2 mb-3">
                <div class="col-6">
                    <input type="text" id="orderCardExp" class="form-control" placeholder="ММ/ГГ" maxlength="5">
                </div>
                <div class="col-6">
                    <input type="text" id="orderCardCVC" class="form-control" placeholder="CVC" maxlength="3">
                </div>
            </div>
            
            <button id="checkoutBtn" class="btn btn-primary w-100 fw-bold" onclick="checkout()">
                <i class="bi bi-credit-card me-2"></i> Оформить заказ
            </button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/db.js"></script>
<script src="js/buyer.js"></script>
</body>
</html>
