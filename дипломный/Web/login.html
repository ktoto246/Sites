<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌾</text></svg>">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | АО Балашовская Хлебная База</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    <script>
        document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('theme') || 'light');
    </script>
</head>
<body class="auth-page">
    <div class="row g-0 vh-100">
        <div class="col-lg-6 d-none d-lg-block auth-image-side position-relative">
            <div class="auth-overlay d-flex flex-column justify-content-center p-5 text-white">

                <h1 class="fw-bold display-5 mb-3">Балашовская Хлебная База</h1>
                <p class="lead fs-4 opacity-75">Надежный партнер в хранении и переработке зерна.</p>
            </div>
        </div>

        <div class="col-lg-6 d-flex align-items-center justify-content-center bg-body">
            <div class="auth-form-container w-100 px-4 px-md-5" style="max-width: 450px;">
                <div class="text-center mb-5 d-lg-none">

                    <h2 class="fw-bold mt-2">БХБ</h2>
                </div>
                
                <h2 class="fw-bold mb-2">Добро пожаловать</h2>
                <p class="text-muted mb-4">Войдите в систему для доступа к заявкам</p>

                <form id="loginForm">
                    <div class="form-floating mb-3 shadow-sm rounded-3">
                        <input type="email" class="form-control border-0 bg-body-tertiary" id="emailInput" placeholder="name@example.com" required>
                        <label for="emailInput" class="text-muted">E-mail адрес</label>
                    </div>
                    <div class="form-floating mb-4 shadow-sm rounded-3">
                        <input type="password" class="form-control border-0 bg-body-tertiary" id="passwordInput" placeholder="Пароль" required>
                        <label for="passwordInput" class="text-muted">Пароль</label>
                    </div>
                    
                    <div id="errorMessage" class="text-danger small mb-3 d-none text-center fw-bold bg-danger bg-opacity-10 p-2 rounded"></div>
                    
                    <button class="btn btn-agro w-100 py-3 mb-4 rounded-3 shadow-sm fw-bold fs-5" type="submit">
                        Войти
                    </button>
                    
                    <div class="text-center">
                        <span class="text-muted">Нет аккаунта?</span> 
                        <a href="register.html" class="text-primary text-decoration-none fw-bold ms-1 auth-link">Создать сейчас</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
