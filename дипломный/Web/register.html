<!DOCTYPE html>
<html lang="ru">
<head>
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-bs-theme', savedTheme);
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация | АО Балашовская Хлебная База</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌾</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/register.css">
</head>
<body class="auth-page">
    <div class="row g-0 min-vh-100 flex-lg-row-reverse">
        <div class="col-lg-6 d-none d-lg-block auth-image-side position-relative">
            <div class="auth-overlay d-flex flex-column justify-content-center align-items-end text-end p-5 text-white">
                <h1 class="fw-bold display-5 mb-3">Личный Кабинет</h1>
                <p class="lead fs-4 opacity-75">Прозрачность. Скорость.<br>Полный контроль ваших заявок.</p>
            </div>
        </div>

        <div class="col-lg-6 d-flex align-items-center justify-content-center bg-body py-5">
            <div class="auth-form-container w-100 px-4 px-md-5" style="max-width: 500px;">
                <div class="text-center mb-5 d-lg-none">
                    <h2 class="fw-bold mt-2">Регистрация</h2>
                </div>
                
                <h2 class="fw-bold mb-2">Создать аккаунт</h2>
                <p class="text-muted mb-4">Станьте нашим партнером прямо сейчас</p>

                <form id="registerForm">
                    <div class="form-floating mb-3 shadow-sm rounded-3">
                        <input type="text" class="form-control border-0 bg-body-tertiary" id="nameInput" placeholder="ИП Иванов И.И." required>
                        <label for="nameInput" class="text-muted">ФИО / Название организации</label>
                    </div>
                    <div class="form-floating mb-3 shadow-sm rounded-3">
                        <input type="tel" class="form-control border-0 bg-body-tertiary" id="phoneInput" placeholder="+7 (999) 000-00-00" required>
                        <label for="phoneInput" class="text-muted">Контактный телефон</label>
                    </div>
                    <div class="form-floating mb-3 shadow-sm rounded-3">
                        <input type="email" class="form-control border-0 bg-body-tertiary" id="emailInput" placeholder="name@example.com" required>
                        <label for="emailInput" class="text-muted">E-mail адрес</label>
                    </div>
                    <div class="form-floating mb-4 shadow-sm rounded-3">
                        <input type="password" class="form-control border-0 bg-body-tertiary" id="passwordInput" placeholder="Пароль" required minlength="4">
                        <label for="passwordInput" class="text-muted">Пароль</label>
                    </div>
                    
                    <div id="errorMessage" class="text-danger small mb-3 d-none text-center fw-bold bg-danger bg-opacity-10 p-2 rounded"></div>
                    
                    <button class="btn btn-agro w-100 py-3 mb-4 rounded-3 shadow-sm fw-bold fs-5" type="submit">
                        Зарегистрироваться
                    </button>
                    
                    <div class="text-center">
                        <span class="text-muted">Уже есть аккаунт?</span> 
                        <a href="login.html" class="text-success text-decoration-none fw-bold ms-1 auth-link">Войти здесь</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="js/register.js"></script>
</body>
</html>
